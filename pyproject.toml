[project]
name = "realm-engine"
version = "0.10.0"
description = "Local-first Hybrid RAG & Multi-Turn AI Knowledge Engine with optional read-only public API mode."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Luis Godoy Alvarez" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
realm-engine = "realm_engine:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "features", "src/realm_engine"]
exclude = ["**/test_*.py", "**/conftest.py", "**/__pycache__"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"desktop_app.py" = "desktop_app.py"
"examples/starter_vault/welcome.md" = "examples/starter_vault/welcome.md"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
desktop = [
    "dmgbuild>=1.6.1; sys_platform == 'darwin'",
    "pyinstaller>=6.12.0",
    "pywebview>=5.3.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
exclude = ["dist", "build", ".venv", "**/__pycache__"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
